rules:
  - id: PHYSICAL_IOPS_LIMIT
    description: "Physical Constraint: SATA drives cannot exceed 500 IOPS per disk. 100k IOPS is impossible."
    target_field: "iops"
    condition: "iops <= 500"
    # Unified Assertion Interface: Check the value in the generated JSON
    assertion: "input.get('iops', 0) <= 500"
    severity: "CRITICAL"
  - id: GDPR_RESIDENCY
    description: "Compliance: EU data residency must be STRICT_EU."
    target_field: "residency"
    condition: "residency == 'STRICT_EU'"
    assertion: "input.get('residency') == 'STRICT_EU' if input.get('region') == 'EU' else True"
    severity: "CRITICAL"
