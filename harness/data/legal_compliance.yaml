rules:
  - id: LIABILITY_CAP_MINIMUM
    description: "Legal Asset: For safety-critical software, the supplier liability cap must be at least 200% of the contract value."
    target_field: "liability_limit_percent"
    condition: "liability_limit_percent >= 200"
    assertion: "input.get('liability_limit_percent', 0) >= 200"
    severity: "CRITICAL"
  - id: INDEMNIFICATION_SCOPE
    description: "Legal Asset: Indemnification MUST cover 3rd-party IP infringement without exception."
    target_field: "ip_indemnity"
    condition: "ip_indemnity == 'FULL'"
    assertion: "input.get('ip_indemnity') == 'FULL'"
    severity: "FATAL"
  - id: DISPUTE_RESOLUTION_VENUE
    description: "Governance: The legal venue for disputes must be 'Delaware, USA'."
    target_field: "governing_law_venue"
    condition: "venue == 'Delaware'"
    assertion: "input.get('governing_law_venue') == 'Delaware'"
    severity: "MAJOR"
