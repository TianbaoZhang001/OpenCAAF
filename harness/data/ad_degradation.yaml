# OpenCAAF Domain Constraints: L3 Autonomous Driving Degradation
# For demonstration purpose only. In production environment, physical limitations, datasheet data, etc. can be formalized here.

rules:
  - id: REAR_COLLISION_PREVENTION_DECELERATION
    description: "Rear Safety Constraint: To prevent rear-end collisions during the takeover window, the velocity drop must not exceed the deceleration limit."
    target_field: "vehicle_speed_kmph_t5"
    condition: "(vehicle_speed_kmph_t0 - vehicle_speed_kmph_t5) / (transition_window_seconds * m_per_sec_to_km_per_h_factor) <= max_deceleration_limit"
    assertion: "(input.get('vehicle_speed_kmph_t0') - input.get('vehicle_speed_kmph_t5')) / (input.get('transition_window_seconds') * input.get('m_per_sec_to_km_per_h_factor')) <= input.get('max_deceleration_limit')"
    severity: "CRITICAL"
    
  - id: FORWARD_COLLISION_PREVENTION_PERCEPTION
    description: "Forward Safety Paradox: To prevent a blind forward collision, the physical braking distance at the target speed MUST be strictly less than the perception range."
    target_field: "vehicle_speed_kmph_t5"
    condition: "((vehicle_speed_kmph_t5 / m_per_sec_to_km_per_h_factor) ** 2) / (2 * road_friction_mu * g) < perception_range_limit"
    assertion: "((input.get('vehicle_speed_kmph_t5') / input.get('m_per_sec_to_km_per_h_factor')) ** 2) / (2 * input.get('road_friction_mu') * input.get('g')) < input.get('perception_range_limit')"
    severity: "FATAL"