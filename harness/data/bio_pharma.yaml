rules:
  - id: STERILIZATION_EFFICACY
    description: "Regulatory Mandate (FDA/EMA): Thermal sterilization requires exposure to 121.1°C for minimum 20 minutes to ensure 10^-6 sterility assurance level."
    target_field: "sterilization_temp"
    condition: "sterilization_temp >= 121.1"
    assertion: "input.get('sterilization_temp', 0) >= 121.1"
    severity: "CRITICAL"
  - id: BIOLOGICAL_STABILITY_LIMIT
    description: "Physical Constraint: The active mRNA/Protein complex denatures and loses efficacy if exposed to temperatures above 115.0°C."
    target_field: "active_ingredient_status"
    condition: "processing_temp <= 115.0"
    assertion: "input.get('sterilization_temp', 0) <= 115.0"
    severity: "FATAL"
  - id: BATCH_YIELD_MINIMUM
    description: "Operational Goal: Total batch yield must remain > 90% for economic viability."
    target_field: "yield_rate"
    condition: "yield_rate >= 0.90"
    assertion: "input.get('yield_rate', 0) >= 0.90"
    severity: "MAJOR"
